{% extends "base.html" %}
{% block title %}Update Trek{% endblock %}
{% block content %}
<h2 class="mb-3">Update "{{ trek.name }}"</h2>
<form method="POST" class="col-md-6">
    <div class="mb-3">
        <label class="form-label">Available Slots (max {{ trek.total_slots }})</label>
        <input type="number" name="available_slots" class="form-control" min="0"
               max="{{ trek.total_slots }}" value="{{ trek.available_slots }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Status</label>
        <select name="status" class="form-select" required>
            {% for s in ['Open', 'Started', 'Closed', 'Completed'] %}
                <option value="{{ s }}" {% if trek.status == s %}selected{% endif %}>{{ s }}</option>
            {% endfor %}
        </select>
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{{ url_for('staff.dashboard') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
