{% extends "base.html" %}
{% block title %}All Bookings{% endblock %}
{% block content %}
<h2 class="mb-3">All Bookings</h2>
<table class="table table-bordered bg-white">
    <thead><tr><th>ID</th><th>User</th><th>Trek</th><th>Date</th><th>Status</th></tr></thead>
    <tbody>
    {% for b in bookings %}
        <tr>
            <td>{{ b.id }}</td>
            <td>{{ b.user_name }}</td>
            <td>{{ b.trek_name }}</td>
            <td>{{ b.booking_date }}</td>
            <td><span class="badge bg-info text-dark">{{ b.status }}</span></td>
        </tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
