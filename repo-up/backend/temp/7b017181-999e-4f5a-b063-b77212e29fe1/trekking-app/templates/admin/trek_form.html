{% extends "base.html" %}
{% block title %}{{ 'Edit' if trek else 'New' }} Trek{% endblock %}
{% block content %}
<h2 class="mb-3">{{ 'Edit' if trek else 'New' }} Trek</h2>
<form method="POST" class="col-md-6">
    <div class="mb-3">
        <label class="form-label">Trek Name</label>
        <input type="text" name="name" class="form-control" value="{{ trek.name if trek else '' }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Location</label>
        <input type="text" name="location" class="form-control" value="{{ trek.location if trek else '' }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Difficulty</label>
        <select name="difficulty" class="form-select" required>
            {% for d in ['Easy', 'Moderate', 'Hard'] %}
                <option value="{{ d }}" {% if trek and trek.difficulty == d %}selected{% endif %}>{{ d }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Duration (days)</label>
        <input type="number" name="duration_days" class="form-control" min="1"
               value="{{ trek.duration_days if trek else '' }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Total Slots</label>
        <input type="number" name="total_slots" class="form-control" min="1"
               value="{{ trek.total_slots if trek else '' }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Start Date</label>
        <input type="date" name="start_date" class="form-control" value="{{ trek.start_date if trek else '' }}">
    </div>
    <div class="mb-3">
        <label class="form-label">End Date</label>
        <input type="date" name="end_date" class="form-control" value="{{ trek.end_date if trek else '' }}">
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{{ url_for('admin.treks') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
